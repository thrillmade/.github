name: Dependabot auto-merge

# Reusable workflow that auto-approves and squash-merges Dependabot PRs for
# patch + minor bumps once required CI checks pass. Major bumps are tagged
# for human review.
#
# Consumers wire this up by adding a tiny caller workflow:
#
#   # .github/workflows/dependabot-auto-merge.yml
#   name: Dependabot auto-merge
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened]
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     auto-merge:
#       if: github.actor == 'dependabot[bot]'
#       uses: thrillmade/.github/.github/workflows/dependabot-auto-merge.yml@main
#       secrets: inherit
#
# See thrillmade org §8.1 — near-term unblock until a centralized
# orchestrator App is ready (Path B).

on:
  workflow_call:
    inputs:
      merge-method:
        description: 'Merge method to use (squash | merge | rebase)'
        type: string
        required: false
        default: 'squash'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major bump and stop
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "major bump — needs human review (auto-merge skipped per org policy §8.1)"

      - name: Approve patch/minor bump
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved: ${{ steps.meta.outputs.dependency-names }} ${{ steps.meta.outputs.update-type }}"

      - name: Enable auto-merge for patch/minor bump
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          gh pr merge --auto --${MERGE_METHOD} "$PR_URL"
